# Production stack for the jobs4life VPS. Lives at /opt/jobs4life on the box.
#
# `app` and `worker` are the SAME image (built once from the repo root
# Dockerfile, tagged `jobs4life:latest`) running two different commands. They are
# separate containers so the worker can be stopped without taking the site down
# -- which is the incident response if a user's key starts burning money, the
# other half of it being `JFL_DISABLE_MODEL_CALLS`.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    # Loopback ONLY, and this is not cosmetic: Docker writes its iptables rules
    # ahead of ufw's, so "5432:5432" would be reachable from the internet
    # regardless of `ufw default deny incoming`.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    # Named so `worker` below can run the same image without building it twice.
    image: jobs4life:latest
    restart: unless-stopped
    env_file: .env
    # Same reasoning as above. Cloudflare Tunnel dials out to this port from the
    # host; nothing dials in from outside.
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The app talks to Postgres over the compose network, not the host's
      # loopback publish.
      JFL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

  worker:
    # Same build and same tag as `app`: one image, two commands. `docker compose
    # build app` therefore builds this too, and `up -d` starts it without a
    # second build.
    build:
      context: ./src
      dockerfile: Dockerfile
    image: jobs4life:latest
    command: ["jfl-worker"]
    restart: unless-stopped
    env_file: .env
    # NO `ports`. The worker serves nothing and must not be reachable from
    # anywhere: it talks out to Postgres and to the model API, and nothing talks
    # in to it.
    depends_on:
      db:
        condition: service_healthy
    environment:
      JFL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The kill switch, set here rather than in .env so that turning it on is a
      # one-line edit to this file and a `docker compose up -d worker` -- with
      # the site left running. Any value other than 0/false/no/off turns it ON;
      # the worker then refuses every task whose handler is marked as calling a
      # model and leaves it `pending`, so nothing is lost when it comes back off.
      JFL_DISABLE_MODEL_CALLS: "0"
    # The image's HEALTHCHECK probes the web app's /healthz on port 8000, which
    # this container does not serve. Left on, it would report `unhealthy`
    # forever and hide a real problem behind a permanent false one.
    healthcheck:
      disable: true
    # Docker sends SIGTERM and then SIGKILL this long after. The worker finishes
    # the task in hand on SIGTERM, and the slowest known task is a ~2-minute
    # claim-gate call, so anything under that guarantees a kill mid-task on
    # every deploy. A killed task is not lost -- it is reclaimed after the
    # visibility timeout and run again -- but re-running a gate call means paying
    # for it twice, so the grace period is set to make that the exception.
    stop_grace_period: 150s

volumes:
  pgdata:
