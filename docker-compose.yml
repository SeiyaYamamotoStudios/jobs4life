services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jfl
      POSTGRES_PASSWORD: jfl
      POSTGRES_DB: jfl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jfl -d jfl"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
