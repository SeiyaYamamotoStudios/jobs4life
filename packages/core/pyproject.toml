[project]
name = "jfl-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "alembic>=1.14",
  # AES-GCM for credential custody (jfl_core.crypto.envelope).
  "cryptography>=44",
  # PDF text extraction (jfl_core.ingest.pdf). Pure Python, BSD-3, no system
  # binary -- and one reader, so the claim gate and CV upload can never
  # disagree about what a PDF says.
  "pypdf>=5.1",
]

[project.optional-dependencies]
# Kept out of the default install: torch is ~3GB and Blackwell (sm_120) needs cu128 wheels.
embeddings = ["sentence-transformers>=3.3", "torch>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jfl_core"]
