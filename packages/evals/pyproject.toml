[project]
name = "jfl-evals"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["jfl-core", "jfl-gate", "inspect-ai>=0.3.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jfl_evals"]

[tool.uv.sources]
jfl-core = { workspace = true }
jfl-gate = { workspace = true }
