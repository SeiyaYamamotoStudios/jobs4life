[project]
name = "jfl-gate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# pypdf because the real inputs are PDF CVs; pure python, no system poppler.
# No typer here -- the CLI lives in packages/cli; this package has no entry point.
dependencies = ["jfl-core", "anthropic>=0.40", "pypdf>=5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jfl_gate"]

[tool.uv.sources]
jfl-core = { workspace = true }
