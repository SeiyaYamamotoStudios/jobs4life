[project]
name = "jfl-generate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# jfl-gate for MODEL/compute_cost_usd/format_corpus, reused rather than duplicated.
dependencies = ["jfl-core", "jfl-gate", "anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jfl_generate"]

[tool.uv.sources]
jfl-core = { workspace = true }
jfl-gate = { workspace = true }
